<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1180" viewBox="0 0 1600 1180"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#d4af37"/></marker></defs>
<rect width="1600" height="1180" fill="#f5f6f8"/>
<rect x="32" y="28" width="1536" height="124" rx="24" fill="#fff" stroke="#e3e5eb"/>
<rect x="32" y="28" width="12" height="124" rx="5" fill="#d4af37"/>
<text x="64" y="64" fill="#806414" font-family="Arial, sans-serif" font-size="13" font-weight="700">THE ONE FLOW  /  PARCOURS CLIENT</text>
<text x="64" y="103" fill="#242730" font-family="Arial, sans-serif" font-size="32" font-weight="700">Ce qui doit être écrit dans chaque accord.</text>
<text x="64" y="130" fill="#626977" font-family="Arial, sans-serif" font-size="15" font-weight="400">Une checklist commerciale à compléter avec vos vrais tarifs et vos conditions.</text>
<text x="1485" y="65" fill="#626977" font-family="Arial, sans-serif" font-size="15" font-weight="400">02 / 02</text>
<rect x="66" y="191" width="470" height="286" rx="20" fill="#e9ebf0"/>
<rect x="64" y="186" width="470" height="286" rx="20" fill="#fff" stroke="#e3e5eb"/>
<text x="88" y="229" fill="#242730" font-family="Arial, sans-serif" font-size="21" font-weight="700">01  Parties et livrables</text>
<text x="88" y="271" fill="#626977" font-family="Arial, sans-serif" font-size="17" font-weight="400">Raison sociale, adresse et identifiants.</text>
<text x="88" y="307" fill="#626977" font-family="Arial, sans-serif" font-size="17" font-weight="400">Quantité par format et par période.</text>
<text x="88" y="343" fill="#626977" font-family="Arial, sans-serif" font-size="17" font-weight="400">1 frame de story = 1 unité : 5 frames = 5.</text>
<text x="88" y="379" fill="#626977" font-family="Arial, sans-serif" font-size="17" font-weight="400">Carrousel : nombre maximal de slides.</text>
<text x="88" y="415" fill="#626977" font-family="Arial, sans-serif" font-size="17" font-weight="400">Reel : durée, tournage et sous-titres.</text>
<text x="88" y="451" fill="#626977" font-family="Arial, sans-serif" font-size="17" font-weight="400">Shooting : durée, lieu et frais inclus.</text>
<rect x="564" y="191" width="470" height="286" rx="20" fill="#e9ebf0"/>
<rect x="562" y="186" width="470" height="286" rx="20" fill="#fff" stroke="#e3e5eb"/>
<text x="586" y="229" fill="#242730" font-family="Arial, sans-serif" font-size="21" font-weight="700">02  Adaptations et exclusions</text>
<text x="586" y="271" fill="#626977" font-family="Arial, sans-serif" font-size="17" font-weight="400">Réseaux et langues inclus, par format.</text>
<text x="586" y="307" fill="#626977" font-family="Arial, sans-serif" font-size="17" font-weight="400">Adaptation, recadrage et repost : préciser.</text>
<text x="586" y="343" fill="#626977" font-family="Arial, sans-serif" font-size="17" font-weight="400">Community management et horaires.</text>
<text x="586" y="379" fill="#626977" font-family="Arial, sans-serif" font-size="17" font-weight="400">Budget publicitaire, impressions, déplacements.</text>
<text x="586" y="415" fill="#626977" font-family="Arial, sans-serif" font-size="17" font-weight="400">Unités inutilisées : report écrit ou aucun.</text>
<rect x="1062" y="191" width="470" height="286" rx="20" fill="#e9ebf0"/>
<rect x="1060" y="186" width="470" height="286" rx="20" fill="#fff" stroke="#e3e5eb"/>
<text x="1084" y="229" fill="#242730" font-family="Arial, sans-serif" font-size="21" font-weight="700">03  Retours et validations</text>
<text x="1084" y="271" fill="#626977" font-family="Arial, sans-serif" font-size="17" font-weight="400">Nom du contact qui valide les contenus.</text>
<text x="1084" y="307" fill="#626977" font-family="Arial, sans-serif" font-size="17" font-weight="400">2 tours consolidés inclus par livrable.</text>
<text x="1084" y="343" fill="#626977" font-family="Arial, sans-serif" font-size="17" font-weight="400">48 h pour les livrables selon l’accord.</text>
<text x="1084" y="379" fill="#626977" font-family="Arial, sans-serif" font-size="17" font-weight="400">Silence ≠ accord sur un devis ou un extra.</text>
<text x="1084" y="415" fill="#626977" font-family="Arial, sans-serif" font-size="17" font-weight="400">Nouveau contenu ou direction : qualifier.</text>
<rect x="66" y="511" width="470" height="286" rx="20" fill="#e9ebf0"/>
<rect x="64" y="506" width="470" height="286" rx="20" fill="#fff" stroke="#e3e5eb"/>
<text x="88" y="549" fill="#242730" font-family="Arial, sans-serif" font-size="21" font-weight="700">04  Calendrier et responsabilités</text>
<text x="88" y="591" fill="#626977" font-family="Arial, sans-serif" font-size="17" font-weight="400">Dates de début et de fin de prestation.</text>
<text x="88" y="627" fill="#626977" font-family="Arial, sans-serif" font-size="17" font-weight="400">Logo, photos, accès et brief à fournir.</text>
<text x="88" y="663" fill="#626977" font-family="Arial, sans-serif" font-size="17" font-weight="400">Brief J−14 · envoi J−7 · validation J−5.</text>
<text x="88" y="699" fill="#626977" font-family="Arial, sans-serif" font-size="17" font-weight="400">Prêt J−1 · gel du calendrier J−7.</text>
<text x="88" y="735" fill="#626977" font-family="Arial, sans-serif" font-size="17" font-weight="400">Retard client ou exception : accord studio.</text>
<rect x="564" y="511" width="470" height="286" rx="20" fill="#e9ebf0"/>
<rect x="562" y="506" width="470" height="286" rx="20" fill="#fff" stroke="#e3e5eb"/>
<text x="586" y="549" fill="#242730" font-family="Arial, sans-serif" font-size="21" font-weight="700">05  Prix, paiement et fin de contrat</text>
<text x="586" y="591" fill="#626977" font-family="Arial, sans-serif" font-size="17" font-weight="400">Prix HT, TVA et total TTC.</text>
<text x="586" y="627" fill="#626977" font-family="Arial, sans-serif" font-size="17" font-weight="400">Échéances et modalités de paiement.</text>
<text x="586" y="663" fill="#626977" font-family="Arial, sans-serif" font-size="17" font-weight="400">Renouvellement et préavis de résiliation.</text>
<text x="586" y="699" fill="#626977" font-family="Arial, sans-serif" font-size="17" font-weight="400">Droits d’usage, musique et fichiers sources.</text>
<text x="586" y="735" fill="#626977" font-family="Arial, sans-serif" font-size="17" font-weight="400">Extras : tarif unitaire ou devis séparé.</text>
<rect x="1062" y="511" width="470" height="286" rx="20" fill="#e9ebf0"/>
<rect x="1060" y="506" width="470" height="286" rx="20" fill="#fff" stroke="#e3e5eb"/>
<text x="1084" y="549" fill="#242730" font-family="Arial, sans-serif" font-size="21" font-weight="700">06  Accord et traçabilité</text>
<text x="1084" y="591" fill="#626977" font-family="Arial, sans-serif" font-size="17" font-weight="400">Devis envoyé puis accepté explicitement.</text>
<text x="1084" y="627" fill="#626977" font-family="Arial, sans-serif" font-size="17" font-weight="400">Contrat issu de ce devis, mêmes conditions.</text>
<text x="1084" y="663" fill="#626977" font-family="Arial, sans-serif" font-size="17" font-weight="400">Numéro, version, identité et horodatage.</text>
<text x="1084" y="699" fill="#626977" font-family="Arial, sans-serif" font-size="17" font-weight="400">Document envoyé : contenu non réécrit.</text>
<text x="1084" y="735" fill="#626977" font-family="Arial, sans-serif" font-size="17" font-weight="400">Conserver document signé / preuve d’accord.</text>
<rect x="64" y="842" width="1468" height="195" rx="20" fill="#fbf7e8" stroke="#eadba4"/>
<text x="88" y="881" fill="#806414" font-family="Arial, sans-serif" font-size="15" font-weight="700">MODE D’EMPLOI DANS L’APP</text>
<text x="88" y="918" fill="#242730" font-family="Arial, sans-serif" font-size="20" font-weight="400">Client → Pipeline &amp; documents → Définir le forfait → Créer le devis → Envoyer.</text>
<text x="88" y="954" fill="#242730" font-family="Arial, sans-serif" font-size="20" font-weight="400">Client : Documents → lire les conditions → accepter. Studio : Créer le contrat depuis le devis accepté.</text>
<text x="88" y="990" fill="#242730" font-family="Arial, sans-serif" font-size="20" font-weight="400">Demandes → qualifier inclus / extra → créer et envoyer le devis extra → attendre son accord → produire.</text>
<text x="64" y="1083" fill="#626977" font-family="Arial, sans-serif" font-size="16" font-weight="400">Les tarifs restent à renseigner. Les anciennes prestations ne sont pas requalifiées automatiquement.</text>
<text x="64" y="1112" fill="#626977" font-family="Arial, sans-serif" font-size="16" font-weight="400">Le portail conserve une décision authentifiée ; il ne prétend pas fournir une signature électronique certifiée.</text>
<text x="64" y="1151" fill="#626977" font-family="Arial, sans-serif" font-size="12" font-weight="400">Référence : DGSSI · loi 43-20 relative aux services de confiance pour les transactions électroniques.</text>
</svg>